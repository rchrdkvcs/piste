name: piste
description: "Piste — suivi de candidatures hors ligne (Flutter, SQLite)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adaptive_platform_ui: ^1.0.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Icônes générées depuis `LogoPiste` :
#   flutter test tool/generer_icones_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icone/icone.png
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/icone/icone_ios_sombre.png
  image_path_ios_tinted_grayscale: assets/icone/icone_ios_teinte.png
  android: true
  adaptive_icon_background: assets/icone/icone_android_fond.png
  adaptive_icon_foreground: assets/icone/icone_android_premier_plan.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icone/icone_android_premier_plan.png
